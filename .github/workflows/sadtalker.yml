name: SadTalker animate
on:
  workflow_dispatch:
    inputs:
      image:
        description: image in input/
        default: baby3.png
      audio:
        description: wav in input/
        default: a3.wav
jobs:
  animate:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - uses: actions/cache@v4
        with:
          path: |
            SadTalker/checkpoints
            SadTalker/gfpgan
          key: sadtalker-models-v2
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git SadTalker_src && cp -rn SadTalker_src/. SadTalker/ 2>/dev/null || mv SadTalker_src SadTalker
          cd SadTalker
          pip install torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          mkdir -p checkpoints gfpgan/weights
          find checkpoints gfpgan -size 0 -delete
          B=https://huggingface.co/camenduru/SadTalker/resolve/main/new
          for f in checkpoints/SadTalker_V0.0.2_256.safetensors checkpoints/mapping_00109-model.pth.tar checkpoints/mapping_00229-model.pth.tar gfpgan/weights/alignment_WFLW_4HG.pth gfpgan/weights/detection_Resnet50_Final.pth gfpgan/weights/parsing_parsenet.pth gfpgan/weights/GFPGANv1.4.pth; do
            [ -s "$f" ] || wget -q --tries=5 -O "$f" "$B/$f"
          done
          ls -la checkpoints gfpgan/weights
      - name: Run
        run: |
          cd SadTalker
          python inference.py --driven_audio ../input/${{ inputs.audio }} --source_image ../input/${{ inputs.image }} --result_dir ../out --still --preprocess full --cpu --size 256 --enhancer none || python inference.py --driven_audio ../input/${{ inputs.audio }} --source_image ../input/${{ inputs.image }} --result_dir ../out --still --preprocess full --cpu
          find ../out -name "*.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: out/**/*.mp4
